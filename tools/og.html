<!doctype html>
<!-- Social card compositor — screenshot this page at exactly 1200x630 to produce assets/og-card.png -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    .stage {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background-image: url('../assets/map-board.webp');
      background-size: cover; background-position: center 38%;
    }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: radial-gradient(ellipse at center, rgba(255,251,241,0.18) 0%, rgba(39,49,74,0.28) 100%);
    }
    .card {
      background: rgba(255, 251, 241, 0.96);
      border-top: 4px solid #C9A95C; border-bottom: 4px solid #C9A95C;
      box-shadow: 0 18px 50px rgba(39,49,74,0.4); padding: 40px 80px; text-align: center;
    }
    h1 { font-family: 'Press Start 2P', monospace; font-size: 50px; line-height: 1.35; margin: 0 0 22px;
         color: #E2725B; text-shadow: 4px 4px 0 rgba(39,49,74,0.15); }
    h1 span { color: #20748A; }
    .tag { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 30px; color: #27314A; margin: 0 0 26px; }
    .cta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 1px;
           color: #27314A; background: #D8A24A; border-radius: 8px;
           box-shadow: 0 5px 0 #27314A; display: inline-block; padding: 16px 28px; }
    .brand { font-family: 'Press Start 2P', monospace; font-size: 13px; color: #7E0CF7; margin-top: 26px; }
    .croissant { font-size: 44px; position: absolute; top: 28px; right: 44px; transform: rotate(12deg); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="overlay">
      <div class="card">
        <div class="croissant">🥐</div>
        <h1>CROISETTE<br><span>OR BUST</span></h1>
        <p class="tag">Survive the festival. Come home with ROI.</p>
        <div class="cta">PLAY AT CROISETTEORBUST.COM</div>
        <div class="brand">A SILLY GAME BY NEURALIFT.AI</div>
      </div>
    </div>
  </div>
</body>
</html>
